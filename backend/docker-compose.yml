services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: crowdpredict
      POSTGRES_USER: crowdpredict
      POSTGRES_PASSWORD: crowdpredict
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crowdpredict -d crowdpredict"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/crowdpredict
      SPRING_DATASOURCE_USERNAME: crowdpredict
      SPRING_DATASOURCE_PASSWORD: crowdpredict
      JWT_SECRET: change-me-before-deploying-32-chars-minimum
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "8080:8080"
    volumes:
      - app-data:/app/data

volumes:
  db-data:
  app-data:
